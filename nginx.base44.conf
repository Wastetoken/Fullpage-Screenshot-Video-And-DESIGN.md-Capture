server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the popup as the landing page
    location = / {
        try_files /index.html /src/pages/popup.html =404;
    }

    # Static assets, chunks, etc. — served from root
    location / {
        try_files $uri $uri/ =404;
    }

    # Correct MIME for JS modules
    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
    }
}
